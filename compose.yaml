services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: greenchain
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: greenchain
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["greenchain-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenchain"]
      interval: 5s
      retries: 10
volumes:
  greenchain-db:
